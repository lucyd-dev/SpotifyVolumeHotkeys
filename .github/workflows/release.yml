name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        env:
          VCPKG_BINARY_SOURCES: default,rw

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ runner.os }}-vcpkg-binary-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-binary-

      - name: Configure (VS preset)
        run: cmake --preset windows-vs

      - name: Build (Release)
        run: cmake --build --preset release

      - name: Stage release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging
          Copy-Item build\windows-vs\Release\SpotifyVolumeHotkey.exe, build\windows-vs\Release\*.dll staging\

      - name: Bundle zip
        shell: pwsh
        run: Compress-Archive -Path staging\* -DestinationPath "SpotifyVolumeHotkeys-${{ github.ref_name }}.zip"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          name: SpotifyVolumeHotkeys ${{ github.ref_name }}
          generate_release_notes: true
          files: SpotifyVolumeHotkeys-${{ github.ref_name }}.zip
