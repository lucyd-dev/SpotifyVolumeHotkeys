name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 / MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          install: mingw-w64-x86_64-toolchain make

      - name: Configure CMake (Release)
        shell: msys2 {0}
        run: |
          cmake -S . -B build \
            -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DVCPKG_TARGET_TRIPLET=x64-mingw-w64 \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --config Release --parallel

      - name: Stage release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging
          Copy-Item build\SpotifyVolumeHotkey.exe, build\*.dll staging\

      - name: Bundle zip
        shell: pwsh
        run: Compress-Archive -Path staging\* -DestinationPath "SpotifyVolumeHotkeys-${{ github.ref_name }}.zip"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          name: SpotifyVolumeHotkeys ${{ github.ref_name }}
          generate_release_notes: true
          files: SpotifyVolumeHotkeys-${{ github.ref_name }}.zip